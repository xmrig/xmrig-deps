# Windows on ARM64 with MinGW (the clangarm64 environment of MSYS2). OpenSSL has this target only from
# version 3.6, the same definition as there. Remove this file when the version in versions.cmake has it.

my %targets = (
    "mingwarm64" => {
        inherit_from     => [ "mingw-common" ],
        cflags           => "",
        sys_id           => "MINGWARM64",
        bn_ops           => add("SIXTY_FOUR_BIT"),
        asm_arch         => 'aarch64',
        uplink_arch      => 'armv8',
        perlasm_scheme   => "win64",
        shared_rcflag    => "",
        multilib         => "-arm64",
    },
);
